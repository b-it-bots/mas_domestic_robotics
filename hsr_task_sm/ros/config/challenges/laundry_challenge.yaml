name: laundry_challenge
description: "Navigate to washing machine, grab clothes, bring to washing table and place."

outcomes:
  - SUCCEEDED
  - FAILED

states:

  # --- ENTRY: wait for door then enter arena ---
  - name: WAIT_FOR_DOOR
    type: CheckDoorOpen
    params:
      result_topic: /door_open_checker/result
      wait_timeout: 60.0
    transitions:
      open: ENTER_ARENA
      closed: WAIT_FOR_DOOR
      timeout: ENTER_ARENA

  - name: ENTER_ARENA
    type: NavigateTo
    params:
      destination: greeting
    transitions:
      succeeded: NAV_TO_MACHINE
      failed: NAV_TO_MACHINE
      failed_after_retrying: NAV_TO_MACHINE

  # --- GO TO WASHING MACHINE ---
  - name: NAV_TO_MACHINE
    type: NavigateTo
    params:
      destination: washing_machine
    transitions:
      succeeded: SAY_AT_MACHINE
      failed: SAY_AT_MACHINE
      failed_after_retrying: SAY_AT_MACHINE

  - name: SAY_AT_MACHINE
    type: Speak
    params:
      text: "I am at the washing machine. Preparing to grab the laundry."
    transitions:
      succeeded: ARM_CLEANING_POSE
      failed: ARM_CLEANING_POSE
      failed_after_retrying: ARM_CLEANING_POSE

  # --- PREPARE ARM + GRIPPER ---
  - name: ARM_CLEANING_POSE
    type: ArmCleaningPose
    transitions:
      succeeded: OPEN_GRIPPER
      failed: OPEN_GRIPPER   # try anyway

  - name: OPEN_GRIPPER
    type: OpenGripper
    transitions:
      succeeded: MOVE_FORWARD

  # --- DRIVE INTO MACHINE AND GRAB ---
  # Robot moves forward until laser reads stop_distance from machine opening
  - name: MOVE_FORWARD
    type: MoveToDistance
    params:
      stop_distance: 0.30   # metres from machine — tune based on machine depth
      vx: 0.10              # m/s — slow and controlled
      timeout: 15.0
    transitions:
      succeeded: CLOSE_GRIPPER
      failed: CLOSE_GRIPPER  # try to grab anyway

  - name: CLOSE_GRIPPER
    type: CloseGripper
    params:
      position: -0.50   # firm grip on clothes — tune (-0.79 = fully closed)
      duration: 2.0
    transitions:
      succeeded: MOVE_BACKWARD

  # --- PULL OUT WITH CLOTHES ---
  - name: MOVE_BACKWARD
    type: MoveBaseVel
    params:
      vx: -0.15     # m/s backward
      duration: 2.0
    transitions:
      succeeded: ARM_NEUTRAL

  - name: ARM_NEUTRAL
    type: ArmNeutralPose
    transitions:
      succeeded: SAY_GOT_LAUNDRY
      failed: SAY_GOT_LAUNDRY

  - name: SAY_GOT_LAUNDRY
    type: Speak
    params:
      text: "I have the laundry. Taking it to the washing table."
    transitions:
      succeeded: NAV_TO_WASHING_TABLE
      failed: NAV_TO_WASHING_TABLE
      failed_after_retrying: NAV_TO_WASHING_TABLE

  # --- GO TO WASHING TABLE AND PLACE ---
  - name: NAV_TO_WASHING_TABLE
    type: NavigateTo
    params:
      destination: washing_table
    transitions:
      succeeded: HEAD_DOWN
      failed: HEAD_DOWN
      failed_after_retrying: HEAD_DOWN

  - name: HEAD_DOWN
    type: SetHeadPose
    params:
      tilt: 0.20
      pan: 0.0
    transitions:
      succeeded: PERCEIVE_TABLE

  - name: PERCEIVE_TABLE
    type: PerceiveTable
    params:
      plane_prefix: table
      retries: 2
    transitions:
      succeeded: PLACE
      failed: PLACE             # try to place anyway
      failed_after_retrying: PLACE

  - name: PLACE
    type: PlaceObject
    params:
      z_offset: 0.03
      retries: 2
    transitions:
      succeeded: SAY_DONE
      failed: SAY_DONE
      failed_after_retrying: SAY_DONE

  # --- FINISH ---
  - name: SAY_DONE
    type: Speak
    params:
      text: "Laundry has been placed on the washing table. Task complete."
    transitions:
      succeeded: SUCCEEDED
      failed: SUCCEEDED
