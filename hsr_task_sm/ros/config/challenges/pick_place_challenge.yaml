# Pick and Place Challenge
# RoboCup@Home 2026
#
# Two phases:
#   PHASE 1 - TIDY UP (loop until dining table is clear):
#     Navigate to dining table → perceive → pick → classify → place in correct container → repeat
#     Containers: dishwasher (tableware), trash bin, cabinet (common objects)
#
#   PHASE 2 - SERVE BREAKFAST (4 sequential pick+place cycles):
#     Pick bowl, spoon, cereal, milk from side shelf → place on clean end of dining table
#
# Locations (must match navigation_goals.yaml):
#   dining_table        - main table to tidy
#   dining_table_far    - clean end of dining table for breakfast serving
#   dish_washer         - dishwasher
#   cabinet             - cabinet for common objects
#   shelf               - side table with breakfast items
#   dust_bin           - trash bin (add to navigation_goals.yaml if missing)
#   door1_inside        - arena entry point

name: pick_place_challenge
description: "Tidy up dining table, then serve breakfast"

userdata:
  object_category: ""
  perceived_planes: null
  grasped_object: null
  grasped_object_height: 0.05

# ============================================================================
# STATES
# ============================================================================
states:

  # --------------------------------------------------------------------------
  # INIT
  # --------------------------------------------------------------------------
  - name: CLEAR_COSTMAP
    type: ClearCostmap
    transitions:
      succeeded: WAIT_FOR_DOOR
      failed: WAIT_FOR_DOOR

  - name: WAIT_FOR_DOOR
    type: CheckDoorOpen
    params:
      result_topic: /door_open_checker/result
      wait_timeout: 60.0
    transitions:
      open: ENTER_ARENA
      closed: WAIT_FOR_DOOR
      timeout: ENTER_ARENA

  - name: ENTER_ARENA
    type: NavigateTo
    params:
      destination: door1_inside
    transitions:
      succeeded: NAV_TO_KITCHEN
      failed: NAV_TO_KITCHEN
      failed_after_retrying: NAV_TO_KITCHEN

  - name: NAV_TO_KITCHEN
    type: NavigateTo
    params:
      destination: dining_table
    transitions:
      succeeded: ANNOUNCE_TIDY
      failed: ANNOUNCE_TIDY
      failed_after_retrying: ANNOUNCE_TIDY

  # --------------------------------------------------------------------------
  # PHASE 1 — TIDY UP LOOP
  # --------------------------------------------------------------------------
  - name: ANNOUNCE_TIDY
    type: SpeakResponse
    params:
      text: "Starting tidy up. I will clear the dining table."
    transitions:
      succeeded: HEAD_TABLE
      failed: HEAD_TABLE

  # Look at table surface before perceiving
  - name: HEAD_TABLE
    type: SetHeadPose
    params:
      tilt: 0.20    # slight down to see table
      pan: 0.0
    transitions:
      succeeded: PERCEIVE_DINING

  - name: PERCEIVE_DINING
    type: PerceiveTable
    params:
      plane_prefix: table
      retries: 2
    transitions:
      succeeded: PICK_TIDY
      failed: PICK_TIDY
      failed_after_retrying: ANNOUNCE_BREAKFAST   # table is clear

  - name: PICK_TIDY
    type: PickObject
    params:
      picking_surface_prefix: table
      retries: 2
    transitions:
      succeeded: CLASSIFY_OBJECT
      failed: PERCEIVE_DINING
      failed_after_retrying: ANNOUNCE_BREAKFAST   # nothing left
      find_objects_before_picking: PERCEIVE_DINING

  - name: CLASSIFY_OBJECT
    type: ClassifyObject
    transitions:
      dishwasher: NAV_TO_DISHWASHER
      trash: NAV_TO_TRASH
      cabinet: NAV_TO_CABINET
      breakfast: NAV_RETURN_TIDY            # misplaced breakfast item, skip
      failed: NAV_TO_CABINET                # unknown → cabinet

  # -- dishwasher branch --
  - name: NAV_TO_DISHWASHER
    type: NavigateTo
    params:
      destination: dish_washer
    transitions:
      succeeded: PLACE_DISHWASHER
      failed: PLACE_DISHWASHER
      failed_after_retrying: SAY_NAV_FAIL_TIDY

  - name: PLACE_DISHWASHER
    type: PlaceInContainer
    params:
      container_name: dishwasher
      retries: 2
    transitions:
      succeeded: NAV_RETURN_TIDY
      failed: NAV_RETURN_TIDY
      failed_after_retrying: NAV_RETURN_TIDY

  # -- trash branch: navigate → look down → drop in bin --
  - name: NAV_TO_TRASH
    type: NavigateTo
    params:
      destination: dust_bin
    transitions:
      succeeded: HEAD_BIN
      failed: HEAD_BIN
      failed_after_retrying: SAY_NAV_FAIL_TIDY

  # Tilt head down to see the bin opening before dropping
  - name: HEAD_BIN
    type: SetHeadPose
    params:
      tilt: 0.45    # looking down at bin
      pan: 0.0
    transitions:
      succeeded: DROP_TRASH

  - name: DROP_TRASH
    type: DropInBin
    transitions:
      succeeded: HEAD_NEUTRAL_TRASH
      failed: HEAD_NEUTRAL_TRASH

  - name: HEAD_NEUTRAL_TRASH
    type: SetHeadPose
    params:
      tilt: 0.0
      pan: 0.0
    transitions:
      succeeded: NAV_RETURN_TIDY

  # -- cabinet branch --
  - name: NAV_TO_CABINET
    type: NavigateTo
    params:
      destination: cabinet
    transitions:
      succeeded: PLACE_CABINET
      failed: PLACE_CABINET
      failed_after_retrying: SAY_NAV_FAIL_TIDY

  - name: PLACE_CABINET
    type: PlaceInContainer
    params:
      container_name: cabinet
      retries: 2
    transitions:
      succeeded: NAV_RETURN_TIDY
      failed: NAV_RETURN_TIDY
      failed_after_retrying: NAV_RETURN_TIDY

  - name: SAY_NAV_FAIL_TIDY
    type: SpeakResponse
    params:
      text: "I could not reach the container. Returning for next object."
    transitions:
      succeeded: NAV_RETURN_TIDY
      failed: NAV_RETURN_TIDY

  - name: NAV_RETURN_TIDY
    type: NavigateTo
    params:
      destination: dining_table
    transitions:
      succeeded: PERCEIVE_DINING
      failed: PERCEIVE_DINING
      failed_after_retrying: ANNOUNCE_BREAKFAST

  # --------------------------------------------------------------------------
  # PHASE 2 — SERVE BREAKFAST
  # 4 sequential pick+place cycles: shelf → dining_table_far
  # --------------------------------------------------------------------------
  - name: ANNOUNCE_BREAKFAST
    type: SpeakResponse
    params:
      text: "Dining table is clear. Now I will serve breakfast."
    transitions:
      succeeded: NAV_TO_SHELF_1
      failed: NAV_TO_SHELF_1

  # Breakfast cycle 1 (bowl)
  - name: NAV_TO_SHELF_1
    type: NavigateTo
    params:
      destination: shelf
    transitions:
      succeeded: LIFT_SHELF_1
      failed: LIFT_SHELF_1
      failed_after_retrying: ANNOUNCE_DONE

  # Raise lift joint + tilt head up to see shelf contents
  - name: LIFT_SHELF_1
    type: SetLiftJoint
    params:
      height: 0.25
    transitions:
      succeeded: HEAD_SHELF_1

  - name: HEAD_SHELF_1
    type: SetHeadPose
    params:
      tilt: -0.20   # slight up to see shelf
      pan: 0.0
    transitions:
      succeeded: PERCEIVE_SHELF_1

  - name: PERCEIVE_SHELF_1
    type: PerceiveTable
    params:
      plane_prefix: table
      retries: 2
    transitions:
      succeeded: PICK_B1
      failed: PICK_B1
      failed_after_retrying: ANNOUNCE_DONE

  - name: PICK_B1
    type: PickObject
    params:
      picking_surface_prefix: table
      retries: 2
    transitions:
      succeeded: NAV_TO_SERVE_1
      failed: NAV_TO_SHELF_2
      failed_after_retrying: NAV_TO_SHELF_2
      find_objects_before_picking: PERCEIVE_SHELF_1

  - name: NAV_TO_SERVE_1
    type: NavigateTo
    params:
      destination: dining_table_far
    transitions:
      succeeded: PERCEIVE_SERVE_1
      failed: PERCEIVE_SERVE_1
      failed_after_retrying: NAV_TO_SHELF_2

  - name: PERCEIVE_SERVE_1
    type: PerceiveTable
    params:
      plane_prefix: table
      retries: 1
    transitions:
      succeeded: PLACE_B1
      failed: PLACE_B1
      failed_after_retrying: NAV_TO_SHELF_2

  - name: PLACE_B1
    type: PlaceObject
    params:
      placing_surface_prefix: table
      retries: 2
    transitions:
      succeeded: NAV_TO_SHELF_2
      failed: NAV_TO_SHELF_2
      failed_after_retrying: NAV_TO_SHELF_2

  # Breakfast cycle 2 (spoon)
  - name: NAV_TO_SHELF_2
    type: NavigateTo
    params:
      destination: shelf
    transitions:
      succeeded: LIFT_SHELF_2
      failed: LIFT_SHELF_2
      failed_after_retrying: ANNOUNCE_DONE

  - name: LIFT_SHELF_2
    type: SetLiftJoint
    params:
      height: 0.25
    transitions:
      succeeded: HEAD_SHELF_2

  - name: HEAD_SHELF_2
    type: SetHeadPose
    params:
      tilt: -0.20
      pan: 0.0
    transitions:
      succeeded: PERCEIVE_SHELF_2

  - name: PERCEIVE_SHELF_2
    type: PerceiveTable
    params:
      plane_prefix: table
      retries: 2
    transitions:
      succeeded: PICK_B2
      failed: PICK_B2
      failed_after_retrying: ANNOUNCE_DONE

  - name: PICK_B2
    type: PickObject
    params:
      picking_surface_prefix: table
      retries: 2
    transitions:
      succeeded: NAV_TO_SERVE_2
      failed: NAV_TO_SHELF_3
      failed_after_retrying: NAV_TO_SHELF_3
      find_objects_before_picking: PERCEIVE_SHELF_2

  - name: NAV_TO_SERVE_2
    type: NavigateTo
    params:
      destination: dining_table_far
    transitions:
      succeeded: PERCEIVE_SERVE_2
      failed: PERCEIVE_SERVE_2
      failed_after_retrying: NAV_TO_SHELF_3

  - name: PERCEIVE_SERVE_2
    type: PerceiveTable
    params:
      plane_prefix: table
      retries: 1
    transitions:
      succeeded: PLACE_B2
      failed: PLACE_B2
      failed_after_retrying: NAV_TO_SHELF_3

  - name: PLACE_B2
    type: PlaceObject
    params:
      placing_surface_prefix: table
      retries: 2
    transitions:
      succeeded: NAV_TO_SHELF_3
      failed: NAV_TO_SHELF_3
      failed_after_retrying: NAV_TO_SHELF_3

  # Breakfast cycle 3 (cereal)
  - name: NAV_TO_SHELF_3
    type: NavigateTo
    params:
      destination: shelf
    transitions:
      succeeded: LIFT_SHELF_3
      failed: LIFT_SHELF_3
      failed_after_retrying: ANNOUNCE_DONE

  - name: LIFT_SHELF_3
    type: SetLiftJoint
    params:
      height: 0.25
    transitions:
      succeeded: HEAD_SHELF_3

  - name: HEAD_SHELF_3
    type: SetHeadPose
    params:
      tilt: -0.20
      pan: 0.0
    transitions:
      succeeded: PERCEIVE_SHELF_3

  - name: PERCEIVE_SHELF_3
    type: PerceiveTable
    params:
      plane_prefix: table
      retries: 2
    transitions:
      succeeded: PICK_B3
      failed: PICK_B3
      failed_after_retrying: ANNOUNCE_DONE

  - name: PICK_B3
    type: PickObject
    params:
      picking_surface_prefix: table
      retries: 2
    transitions:
      succeeded: NAV_TO_SERVE_3
      failed: NAV_TO_SHELF_4
      failed_after_retrying: NAV_TO_SHELF_4
      find_objects_before_picking: PERCEIVE_SHELF_3

  - name: NAV_TO_SERVE_3
    type: NavigateTo
    params:
      destination: dining_table_far
    transitions:
      succeeded: PERCEIVE_SERVE_3
      failed: PERCEIVE_SERVE_3
      failed_after_retrying: NAV_TO_SHELF_4

  - name: PERCEIVE_SERVE_3
    type: PerceiveTable
    params:
      plane_prefix: table
      retries: 1
    transitions:
      succeeded: PLACE_B3
      failed: PLACE_B3
      failed_after_retrying: NAV_TO_SHELF_4

  - name: PLACE_B3
    type: PlaceObject
    params:
      placing_surface_prefix: table
      retries: 2
    transitions:
      succeeded: NAV_TO_SHELF_4
      failed: NAV_TO_SHELF_4
      failed_after_retrying: NAV_TO_SHELF_4

  # Breakfast cycle 4 (milk)
  - name: NAV_TO_SHELF_4
    type: NavigateTo
    params:
      destination: shelf
    transitions:
      succeeded: LIFT_SHELF_4
      failed: LIFT_SHELF_4
      failed_after_retrying: ANNOUNCE_DONE

  - name: LIFT_SHELF_4
    type: SetLiftJoint
    params:
      height: 0.25
    transitions:
      succeeded: HEAD_SHELF_4

  - name: HEAD_SHELF_4
    type: SetHeadPose
    params:
      tilt: -0.20
      pan: 0.0
    transitions:
      succeeded: PERCEIVE_SHELF_4

  - name: PERCEIVE_SHELF_4
    type: PerceiveTable
    params:
      plane_prefix: table
      retries: 2
    transitions:
      succeeded: PICK_B4
      failed: PICK_B4
      failed_after_retrying: ANNOUNCE_DONE

  - name: PICK_B4
    type: PickObject
    params:
      picking_surface_prefix: table
      retries: 2
    transitions:
      succeeded: NAV_TO_SERVE_4
      failed: ANNOUNCE_DONE
      failed_after_retrying: ANNOUNCE_DONE
      find_objects_before_picking: PERCEIVE_SHELF_4

  - name: NAV_TO_SERVE_4
    type: NavigateTo
    params:
      destination: dining_table_far
    transitions:
      succeeded: PERCEIVE_SERVE_4
      failed: PERCEIVE_SERVE_4
      failed_after_retrying: ANNOUNCE_DONE

  - name: PERCEIVE_SERVE_4
    type: PerceiveTable
    params:
      plane_prefix: table
      retries: 1
    transitions:
      succeeded: PLACE_B4
      failed: PLACE_B4
      failed_after_retrying: ANNOUNCE_DONE

  - name: PLACE_B4
    type: PlaceObject
    params:
      placing_surface_prefix: table
      retries: 2
    transitions:
      succeeded: ANNOUNCE_DONE
      failed: ANNOUNCE_DONE
      failed_after_retrying: ANNOUNCE_DONE

  # --------------------------------------------------------------------------
  # FINISH
  # --------------------------------------------------------------------------
  - name: ANNOUNCE_DONE
    type: SpeakResponse
    params:
      text: "Pick and place challenge complete. Table is tidy and breakfast is served."
    transitions:
      succeeded: SUCCEEDED
      failed: SUCCEEDED

outcomes:
  - SUCCEEDED
  - FAILED
