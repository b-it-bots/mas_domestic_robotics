name: test_laundry_arm
description: "Test arm cleaning pose, gripper, forward drive, and arm neutral — no navigation."

outcomes:
  - SUCCEEDED
  - FAILED

states:

  # --- PREPARE ARM ---
  - name: SAY_START
    type: Speak
    params:
      text: "Starting arm motion test."
    transitions:
      succeeded: ARM_CLEANING_POSE
      failed: ARM_CLEANING_POSE
      failed_after_retrying: ARM_CLEANING_POSE

  - name: ARM_CLEANING_POSE
    type: ArmCleaningPose
    transitions:
      succeeded: OPEN_GRIPPER
      failed: OPEN_GRIPPER

  - name: OPEN_GRIPPER
    type: OpenGripper
    transitions:
      succeeded: SAY_READY

  - name: SAY_READY
    type: Speak
    params:
      text: "Arm ready. Moving forward toward machine."
    transitions:
      succeeded: MOVE_FORWARD
      failed: MOVE_FORWARD
      failed_after_retrying: MOVE_FORWARD

  # --- DRIVE INTO MACHINE ---
  - name: MOVE_FORWARD
    type: MoveToDistance
    params:
      stop_distance: 0.30   # metres from machine opening — tune this
      vx: 0.10              # m/s forward
      timeout: 15.0
    transitions:
      succeeded: SAY_CLOSE
      failed: SAY_CLOSE

  - name: SAY_CLOSE
    type: Speak
    params:
      text: "At machine. Closing gripper."
    transitions:
      succeeded: CLOSE_GRIPPER
      failed: CLOSE_GRIPPER
      failed_after_retrying: CLOSE_GRIPPER

  - name: CLOSE_GRIPPER
    type: CloseGripper
    params:
      position: -0.50   # tune: -0.79 is fully closed
      duration: 2.0
    transitions:
      succeeded: MOVE_BACKWARD

  # --- PULL BACK ---
  - name: MOVE_BACKWARD
    type: MoveBaseVel
    params:
      vx: -0.15     # m/s backward
      duration: 2.0
    transitions:
      succeeded: ARM_NEUTRAL

  - name: ARM_NEUTRAL
    type: ArmNeutralPose
    transitions:
      succeeded: SAY_DONE
      failed: SAY_DONE

  - name: SAY_DONE
    type: Speak
    params:
      text: "Arm motion test complete."
    transitions:
      succeeded: SUCCEEDED
      failed: SUCCEEDED
