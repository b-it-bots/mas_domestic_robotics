# GPSR Challenge - General Purpose Service Robot
# RoboCup@Home 2026
#
# Stack: Whisper STT + Ollama LLM (slave laptop) + NavigateTo / PerceiveTable / PickObject
#
# Flow:
#   1. Wait for door → enter arena → navigate to instruction point
#   2. Loop 3×:
#        a. GPSRCommandParser (listen + parse → action type as outcome)
#        b. Confirm plan (speak command_description)
#        c. Execute sub-flow (fetch / find_person / tell / guide / count_*)
#        d. Report result → return to instruction point
#   3. Announce done

name: gpsr_challenge
description: "Execute 3 spoken GPSR commands using Whisper STT and Ollama LLM"

userdata:
  instruction_point: "living_room_table"   # Where the operator stands
  operator_location: "living_room_table"
  commands_completed: 0
  recognized_text: ""
  parsed_action: ""
  parsed_target: ""
  parsed_location: ""
  parsed_target_location: ""
  command_description: ""

# ============================================================================
# STATES
# ============================================================================
states:

  # --------------------------------------------------------------------------
  # INIT
  # --------------------------------------------------------------------------
  - name: CLEAR_COSTMAP
    type: ClearCostmap
    transitions:
      succeeded: WAIT_FOR_DOOR
      failed: WAIT_FOR_DOOR

  - name: WAIT_FOR_DOOR
    type: CheckDoorOpen
    params:
      result_topic: /door_open_checker/result
      wait_timeout: 60.0
    transitions:
      open: ENTER_ARENA
      closed: WAIT_FOR_DOOR
      timeout: ENTER_ARENA   # proceed anyway after 60 s

  - name: ENTER_ARENA
    type: NavigateTo
    params:
      destination: door1_inside
    transitions:
      succeeded: NAV_TO_OPERATOR
      failed: NAV_TO_OPERATOR
      failed_after_retrying: NAV_TO_OPERATOR

  - name: NAV_TO_OPERATOR
    type: NavigateTo
    params:
      destination_key: instruction_point
    transitions:
      succeeded: ANNOUNCE_READY
      failed: ANNOUNCE_READY
      failed_after_retrying: ANNOUNCE_READY

  # --------------------------------------------------------------------------
  # COMMAND RECEPTION
  # --------------------------------------------------------------------------
  - name: ANNOUNCE_READY
    type: SpeakResponse
    params:
      text: "I am ready for your command."
    transitions:
      succeeded: PARSE_COMMAND
      failed: PARSE_COMMAND

  # GPSRCommandParser listens, parses and returns action type as outcome
  - name: PARSE_COMMAND
    type: GPSRCommandParser
    transitions:
      fetch: CONFIRM_FETCH
      find_person: CONFIRM_FIND
      tell: CONFIRM_TELL
      guide: CONFIRM_GUIDE
      count_objects: CONFIRM_COUNT_OBJ
      count_persons: CONFIRM_COUNT_PRS
      failed: ASK_CLARIFY

  - name: ASK_CLARIFY
    type: SpeakResponse
    params:
      text: "I could not understand the command. Could you please rephrase?"
    transitions:
      succeeded: PARSE_COMMAND
      failed: PARSE_COMMAND

  # --------------------------------------------------------------------------
  # FETCH  (navigate → perceive → pick → return → announce delivery)
  # --------------------------------------------------------------------------
  - name: CONFIRM_FETCH
    type: SpeakResponse
    params:
      text_key: command_description
    transitions:
      succeeded: FETCH_NAV
      failed: FETCH_NAV

  - name: FETCH_NAV
    type: NavigateTo
    params:
      destination_key: parsed_location
    transitions:
      succeeded: FETCH_PERCEIVE
      failed: FETCH_NAV_FAIL
      failed_after_retrying: FETCH_NAV_FAIL

  - name: FETCH_NAV_FAIL
    type: SpeakResponse
    params:
      text: "I could not reach the location."
    transitions:
      succeeded: REPORT_PARTIAL
      failed: REPORT_PARTIAL

  - name: FETCH_PERCEIVE
    type: PerceiveTable
    transitions:
      succeeded: FETCH_PICK
      failed: FETCH_PERCEIVE_FAIL
      failed_after_retrying: FETCH_PERCEIVE_FAIL

  - name: FETCH_PERCEIVE_FAIL
    type: SpeakResponse
    params:
      text: "I could not find the object on the surface."
    transitions:
      succeeded: REPORT_PARTIAL
      failed: REPORT_PARTIAL

  - name: FETCH_PICK
    type: PickObject
    transitions:
      succeeded: FETCH_RETURN
      failed: FETCH_PICK_FAIL
      failed_after_retrying: FETCH_PICK_FAIL
      find_objects_before_picking: FETCH_PERCEIVE

  - name: FETCH_PICK_FAIL
    type: SpeakResponse
    params:
      text: "I could not pick up the object."
    transitions:
      succeeded: REPORT_PARTIAL
      failed: REPORT_PARTIAL

  - name: FETCH_RETURN
    type: NavigateTo
    params:
      destination_key: operator_location
    transitions:
      succeeded: FETCH_DELIVER
      failed: FETCH_DELIVER
      failed_after_retrying: FETCH_DELIVER

  - name: FETCH_DELIVER
    type: SpeakResponse
    params:
      text: "Here is the object you requested."
    transitions:
      succeeded: REPORT_SUCCESS
      failed: REPORT_SUCCESS

  # --------------------------------------------------------------------------
  # FIND PERSON  (navigate → detect → report)
  # --------------------------------------------------------------------------
  - name: CONFIRM_FIND
    type: SpeakResponse
    params:
      text_key: command_description
    transitions:
      succeeded: FIND_NAV
      failed: FIND_NAV

  - name: FIND_NAV
    type: NavigateTo
    params:
      destination_key: parsed_location
    transitions:
      succeeded: FIND_DETECT
      failed: FIND_NAV_FAIL
      failed_after_retrying: FIND_NAV_FAIL

  - name: FIND_NAV_FAIL
    type: SpeakResponse
    params:
      text: "I could not reach the room to find the person."
    transitions:
      succeeded: REPORT_PARTIAL
      failed: REPORT_PARTIAL

  - name: FIND_DETECT
    type: DetectPerson
    transitions:
      succeeded: FIND_FOUND
      no_person_found: FIND_NOT_FOUND
      failed_after_retrying: FIND_NOT_FOUND

  - name: FIND_FOUND
    type: SpeakResponse
    params:
      text: "I found the person at the location."
    transitions:
      succeeded: REPORT_SUCCESS
      failed: REPORT_SUCCESS

  - name: FIND_NOT_FOUND
    type: SpeakResponse
    params:
      text: "I could not find the person at that location."
    transitions:
      succeeded: REPORT_PARTIAL
      failed: REPORT_PARTIAL

  # --------------------------------------------------------------------------
  # TELL  (navigate → detect person → speak info)
  # --------------------------------------------------------------------------
  - name: CONFIRM_TELL
    type: SpeakResponse
    params:
      text_key: command_description
    transitions:
      succeeded: TELL_NAV
      failed: TELL_NAV

  - name: TELL_NAV
    type: NavigateTo
    params:
      destination_key: parsed_location
    transitions:
      succeeded: TELL_DETECT
      failed: TELL_NAV_FAIL
      failed_after_retrying: TELL_NAV_FAIL

  - name: TELL_NAV_FAIL
    type: SpeakResponse
    params:
      text: "I could not reach the person to deliver the message."
    transitions:
      succeeded: REPORT_PARTIAL
      failed: REPORT_PARTIAL

  - name: TELL_DETECT
    type: DetectPerson
    transitions:
      succeeded: TELL_INFO
      no_person_found: TELL_INFO   # speak regardless
      failed_after_retrying: TELL_INFO

  - name: TELL_INFO
    type: SpeakResponse
    params:
      text_key: command_description
    transitions:
      succeeded: REPORT_SUCCESS
      failed: REPORT_SUCCESS

  # --------------------------------------------------------------------------
  # GUIDE  (navigate to person → follow → navigate to destination)
  # --------------------------------------------------------------------------
  - name: CONFIRM_GUIDE
    type: SpeakResponse
    params:
      text_key: command_description
    transitions:
      succeeded: GUIDE_NAV
      failed: GUIDE_NAV

  - name: GUIDE_NAV
    type: NavigateTo
    params:
      destination_key: parsed_location
    transitions:
      succeeded: GUIDE_DETECT
      failed: GUIDE_NAV_FAIL
      failed_after_retrying: GUIDE_NAV_FAIL

  - name: GUIDE_NAV_FAIL
    type: SpeakResponse
    params:
      text: "I could not reach the person to guide them."
    transitions:
      succeeded: REPORT_PARTIAL
      failed: REPORT_PARTIAL

  - name: GUIDE_DETECT
    type: DetectPerson
    transitions:
      succeeded: GUIDE_ANNOUNCE_FOLLOW
      no_person_found: GUIDE_PERSON_MISSING
      failed_after_retrying: GUIDE_PERSON_MISSING

  - name: GUIDE_PERSON_MISSING
    type: SpeakResponse
    params:
      text: "I could not find the person to guide."
    transitions:
      succeeded: REPORT_PARTIAL
      failed: REPORT_PARTIAL

  - name: GUIDE_ANNOUNCE_FOLLOW
    type: SpeakResponse
    params:
      text: "Please follow me. I will guide you to the destination."
    transitions:
      succeeded: GUIDE_FOLLOW
      failed: GUIDE_FOLLOW

  - name: GUIDE_FOLLOW
    type: FollowPerson
    transitions:
      succeeded: GUIDE_DEST_NAV
      lost_person: GUIDE_DEST_NAV   # proceed even if person stops following
      failed: GUIDE_DEST_NAV

  - name: GUIDE_DEST_NAV
    type: NavigateTo
    params:
      destination_key: parsed_target_location
    transitions:
      succeeded: GUIDE_ARRIVED
      failed: GUIDE_ARRIVED
      failed_after_retrying: GUIDE_ARRIVED

  - name: GUIDE_ARRIVED
    type: SpeakResponse
    params:
      text: "We have arrived at the destination."
    transitions:
      succeeded: REPORT_SUCCESS
      failed: REPORT_SUCCESS

  # --------------------------------------------------------------------------
  # COUNT OBJECTS  (navigate → perceive table → report)
  # --------------------------------------------------------------------------
  - name: CONFIRM_COUNT_OBJ
    type: SpeakResponse
    params:
      text_key: command_description
    transitions:
      succeeded: COUNT_OBJ_NAV
      failed: COUNT_OBJ_NAV

  - name: COUNT_OBJ_NAV
    type: NavigateTo
    params:
      destination_key: parsed_location
    transitions:
      succeeded: COUNT_OBJ_PERCEIVE
      failed: COUNT_OBJ_NAV_FAIL
      failed_after_retrying: COUNT_OBJ_NAV_FAIL

  - name: COUNT_OBJ_NAV_FAIL
    type: SpeakResponse
    params:
      text: "I could not reach the location to count objects."
    transitions:
      succeeded: REPORT_PARTIAL
      failed: REPORT_PARTIAL

  - name: COUNT_OBJ_PERCEIVE
    type: PerceiveTable
    transitions:
      succeeded: COUNT_OBJ_REPORT
      failed: COUNT_OBJ_FAIL
      failed_after_retrying: COUNT_OBJ_FAIL

  - name: COUNT_OBJ_FAIL
    type: SpeakResponse
    params:
      text: "I could not count the objects."
    transitions:
      succeeded: REPORT_PARTIAL
      failed: REPORT_PARTIAL

  - name: COUNT_OBJ_REPORT
    type: SpeakResponse
    params:
      text: "I have finished counting the objects on the surface."
    transitions:
      succeeded: REPORT_SUCCESS
      failed: REPORT_SUCCESS

  # --------------------------------------------------------------------------
  # COUNT PERSONS  (navigate → detect → report)
  # --------------------------------------------------------------------------
  - name: CONFIRM_COUNT_PRS
    type: SpeakResponse
    params:
      text_key: command_description
    transitions:
      succeeded: COUNT_PRS_NAV
      failed: COUNT_PRS_NAV

  - name: COUNT_PRS_NAV
    type: NavigateTo
    params:
      destination_key: parsed_location
    transitions:
      succeeded: COUNT_PRS_DETECT
      failed: COUNT_PRS_NAV_FAIL
      failed_after_retrying: COUNT_PRS_NAV_FAIL

  - name: COUNT_PRS_NAV_FAIL
    type: SpeakResponse
    params:
      text: "I could not reach the room to count people."
    transitions:
      succeeded: REPORT_PARTIAL
      failed: REPORT_PARTIAL

  - name: COUNT_PRS_DETECT
    type: DetectPerson
    transitions:
      succeeded: COUNT_PRS_REPORT
      no_person_found: COUNT_PRS_NONE
      failed_after_retrying: COUNT_PRS_NONE

  - name: COUNT_PRS_REPORT
    type: SpeakResponse
    params:
      text: "I found people in the room."
    transitions:
      succeeded: REPORT_SUCCESS
      failed: REPORT_SUCCESS

  - name: COUNT_PRS_NONE
    type: SpeakResponse
    params:
      text: "I did not find anyone in the room."
    transitions:
      succeeded: REPORT_PARTIAL
      failed: REPORT_PARTIAL

  # --------------------------------------------------------------------------
  # SHARED REPORT + LOOP CONTROL
  # --------------------------------------------------------------------------
  - name: REPORT_SUCCESS
    type: SpeakResponse
    params:
      text: "Command completed successfully."
    transitions:
      succeeded: CHECK_MORE_COMMANDS
      failed: CHECK_MORE_COMMANDS

  - name: REPORT_PARTIAL
    type: SpeakResponse
    params:
      text: "I could only partially complete that command. Moving on."
    transitions:
      succeeded: CHECK_MORE_COMMANDS
      failed: CHECK_MORE_COMMANDS

  # CheckRetries increments the counter itself (no need for IncrementCounter)
  - name: CHECK_MORE_COMMANDS
    type: CheckRetries
    params:
      max_retries: 3
      counter_key: commands_completed
    transitions:
      retry: RETURN_TO_OPERATOR
      max_reached: ANNOUNCE_DONE

  - name: RETURN_TO_OPERATOR
    type: NavigateTo
    params:
      destination_key: instruction_point
    transitions:
      succeeded: ANNOUNCE_READY
      failed: ANNOUNCE_READY
      failed_after_retrying: ANNOUNCE_READY

  # --------------------------------------------------------------------------
  # FINISH
  # --------------------------------------------------------------------------
  - name: ANNOUNCE_DONE
    type: SpeakResponse
    params:
      text: "I have completed all three commands. GPSR challenge finished. Thank you."
    transitions:
      succeeded: SUCCEEDED
      failed: SUCCEEDED

outcomes:
  - SUCCEEDED
  - FAILED
