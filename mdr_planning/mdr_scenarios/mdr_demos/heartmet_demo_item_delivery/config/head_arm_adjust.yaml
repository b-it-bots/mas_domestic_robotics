# Description: Defines a state machine for a RoboCup@Home store groceries scenario
# Author: Alex Mitrevski
# Email: aleksandar.mitrevski@h-brs.de
sm_id: mdr_store_groceries
states: [SCAN_SHELF_1,SCAN_SHELF_2]
outcomes: [DONE, TIMEOUT, FAILED]
state_descriptions:
    
    - state:
        name: SCAN_SHELF_1
        state_module_name: mas_hsr_store_groceries.scenario_states.scan_shelf
        state_class_name: ScanShelf
        transitions:
            - transition:
                name: succeeded
                state: SCAN_SHELF_2
            - transition:
                name: failed
                state: SCAN_SHELF_1
        arguments:
            - argument:
                name: arm_joints
                value:
                    arm_lift_joint: 0.0
                    arm_roll_joint: 1.57
                    wrist_flex_joint: -1.57
            - argument:
                name: head_joints
                value:
                    head_tilt_joint: -0.4
    - state:
        name: SCAN_SHELF_2
        state_module_name: mas_hsr_store_groceries.scenario_states.scan_shelf
        state_class_name: ScanShelf
        transitions:
            - transition:
                name: succeeded
                state: SCAN_SHELF_1
            - transition:
                name: failed
                state: SCAN_SHELF_2
        arguments:
            - argument:
                name: arm_joints
                value:
                    arm_lift_joint: 0.2
                    arm_roll_joint: 1.57
                    wrist_flex_joint: -1.57
            - argument:
                name: head_joints
                value:
                    head_tilt_joint: -0.2
                    
