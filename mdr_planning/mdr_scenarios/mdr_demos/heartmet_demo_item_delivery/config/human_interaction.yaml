  #               lying: [0.0, 0.6]

  - state:
      name: HAND_OVER
      state_module_name: mdr_demo_context_aware_hand_over.scenario_states.hand_over
      state_class_name: HandOver
      transitions:
        - transition:
            name: succeeded
            state: GO_TO_START
        - transition:
            name: failed
            state: HAND_OVER
        - transition:
            name: failed_after_retrying
            state: FAILED
      arguments:
        - argument:
            name: number_of_retries
            value: 3
        - argument:
            name: obstacle_present
            value: False
        - argument:
            name: context_aware
            value: True
        - argument:
            name: release_detection
            value: True
  - state:
      name: GO_TO_START
      state_module_name: mdr_navigation_behaviours.move_base
      state_class_name: MoveBase
      transitions:
        - transition:
            name: succeeded
            state: DONE
        - transition:
            name: failed
            state: GO_TO_LIVING
        - transition:
            name: failed_after_retrying
            state: FAILED
      arguments:
        - argument:
            name: destination_locations
            value: [start]
        - argument:
            name: number_of_retries
            value: 3
